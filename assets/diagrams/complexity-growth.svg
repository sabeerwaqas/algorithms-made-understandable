<svg xmlns="http://www.w3.org/2000/svg" width="760" height="440" viewBox="0 0 760 440" role="img" aria-labelledby="title desc">
<title id="title">Common algorithm growth rates</title>
<desc id="desc">Schematic curves for constant, logarithmic, linear, n log n, quadratic and cubic growth.</desc>
<rect width="760" height="440" fill="#ffffff"/>
<text x="42" y="38" font-family="Arial" font-size="22" font-weight="700" fill="#172033">How algorithmic work grows with input size</text>
<text x="42" y="63" font-family="Arial" font-size="13" fill="#64748b">Schematic curves — compare growth, not actual seconds or exact scale.</text>
<g stroke="#cbd5e1" stroke-width="1.5"><path d="M80 365H700M80 365V95"/></g>
<g font-family="Arial" font-size="13" fill="#64748b"><text x="690" y="390">input size n</text><text x="25" y="100">work</text></g>
<path d="M80 340L700 340" fill="none" stroke="#64748b" stroke-width="3"/>
<path d="M80 365 C140 300 220 280 700 250" fill="none" stroke="#0ea5e9" stroke-width="3"/>
<path d="M80 365L700 210" fill="none" stroke="#16a34a" stroke-width="3"/>
<path d="M80 365 C200 350 330 310 700 150" fill="none" stroke="#8b5cf6" stroke-width="3"/>
<path d="M80 365 Q330 340 700 105" fill="none" stroke="#f59e0b" stroke-width="3"/>
<path d="M80 365 Q260 340 700 80" fill="none" stroke="#ef4444" stroke-width="3"/>
<g font-family="Arial" font-size="14" font-weight="700">
<text x="620" y="330" fill="#64748b">O(1)</text><text x="620" y="248" fill="#0ea5e9">O(log n)</text>
<text x="620" y="205" fill="#16a34a">O(n)</text><text x="550" y="150" fill="#8b5cf6">O(n log n)</text>
<text x="620" y="108" fill="#f59e0b">O(n²)</text><text x="620" y="78" fill="#ef4444">O(n³)</text>
</g>
<text x="42" y="420" font-family="Arial" font-size="12" fill="#64748b">Exponential and factorial growth rise even faster and are omitted from this schematic plot.</text>
</svg>